on:
  push:
    branches:
      - "develop"

name: Release develop branch
jobs:
  remove-old-release:
    runs-on: ubuntu-latest
    steps:
      - name: Remove old "latest" release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest \
            --repo "$GITHUB_REPOSITORY" \
            --cleanup-tag --yes || true

  build-all-platforms:
    needs: remove-old-release
    runs-on: ${{ matrix.os }}
    env:
      ATTACH_RESOURCE_ZIP: "1"
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    name: Decker latest (${{ matrix.os }})
    steps:
      - name: "Test Environment Variable: Posix"
        run: 'echo "The value of ATTACH_RESOURCE_ZIP: $ATTACH_RESOURCE_ZIP"'

      - name: "Test Environment Variable: Windows"
        if: runner.os == 'Windows'
        run: 'echo ("The value of ATTACH_RESOURCE_ZIP:" + $env:ATTACH_RESOURCE_ZIP)'

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop

      # Windows Defender real-time scanning inspects every file GHC/stack
      # writes, which drastically slows Haskell builds. Exclude the build and
      # toolchain directories before any files are written.
      - name: Disable Defender scanning of build dirs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath `
            "$env:GITHUB_WORKSPACE", `
            "$env:APPDATA\stack", `
            "$env:LOCALAPPDATA\Programs\stack"

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          # ~/.stack        - global snapshot packages (all OSes)
          # .stack-work     - project build artifacts
          # ...Programs\stack - GHC + MSYS2 toolchain installed by stack (Windows)
          path: |
            ~/.stack
            .stack-work
            ~/AppData/Local/Programs/stack
          key: ${{ runner.os }}-stack-${{ hashFiles('stack.yaml', 'stack.yaml.lock', 'package.yaml') }}
          restore-keys: |
            ${{ runner.os }}-stack-

      # bzlib-conduit (via the Stackage snapshot) needs the system bz2 C library.
      - name: Install bzip2 with dev headers
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y bzip2 libbz2-dev

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-no-global: true
          stack-version: latest
          stack-setup-ghc: true

      # On Windows GHC links against Stack's bundled MSYS2/mingw toolchain, so
      # bz2 must be installed there (after stack setup has provisioned MSYS2).
      - name: Install libbz2 (Windows)
        if: runner.os == 'Windows'
        run: stack exec -- pacman --sync --noconfirm --needed mingw-w64-x86_64-bzip2

      - name: Build & test
        run: |
          stack test
          stack --local-bin-path=dist install

      - name: Rename executable
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          mv dist/decker "dist/decker-latest-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}"

      - name: Rename executable
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          mv dist/decker.exe "dist/decker-latest-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}.exe"

      - name: Release
        uses: "softprops/action-gh-release@v2"
        with:
          token: ${{ github.token }}
          name: latest
          tag_name: latest
          target_commitish: develop
          draft: false
          prerelease: true
          files: |
            readme.md
            changelog.md
            dist/**
