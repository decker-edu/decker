on:
  push:
    tags:
      - "v**"

name: Build Release
jobs:
  build-all-platforms:
    runs-on: ${{ matrix.os }}
    env:
      ATTACH_RESOURCE_ZIP: '1'
    strategy:
      matrix:
        os:
          - ubuntu-latest      # Linux X64
          - macos-latest       # macOS ARM64 (Apple Silicon)
          - windows-latest
    name: Decker ${{ github.ref_name }} (${{ matrix.os }})
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      # Windows Defender real-time scanning inspects every file GHC/stack
      # writes, which drastically slows Haskell builds. Exclude the build and
      # toolchain directories before any files are written.
      - name: Disable Defender scanning of build dirs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath `
            "$env:GITHUB_WORKSPACE", `
            "$env:APPDATA\stack", `
            "$env:LOCALAPPDATA\Programs\stack"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          # ~/.stack        - global snapshot packages (all OSes)
          # .stack-work     - project build artifacts
          # ...Programs\stack - GHC + MSYS2 toolchain installed by stack (Windows)
          path: |
            ~/.stack
            .stack-work
            ~/AppData/Local/Programs/stack
          key: ${{ runner.os }}-stack-${{ hashFiles('stack.yaml', 'stack.yaml.lock', 'package.yaml') }}
          restore-keys: |
            ${{ runner.os }}-stack-

      # bzlib-conduit (via the Stackage snapshot) needs the system bz2 C library.
      - name: Install libbz2 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libbz2-dev

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-no-global: true
          stack-version: "latest"
          stack-setup-ghc: true

      # On Windows GHC links against Stack's bundled MSYS2/mingw toolchain, so
      # bz2 must be installed there (after stack setup has provisioned MSYS2).
      - name: Install libbz2 (Windows)
        if: runner.os == 'Windows'
        run: stack exec -- pacman --sync --noconfirm --needed mingw-w64-x86_64-bzip2

      - name: Build & test
        run: |
          stack test
          stack --local-bin-path=dist install

      - name: Rename executable
        if: ${{ matrix.os != 'windows-latest' }}
        run: |
          mv dist/decker "dist/decker-${{ github.ref_name }}-${{ runner.os }}-${{ runner.arch }}"

      - name: Rename executable
        if: ${{ matrix.os == 'windows-latest' }}
        run: |
          mv dist/decker.exe "dist/decker-${{ github.ref_name }}-${{ runner.os }}-${{ runner.arch }}.exe"

      - name: Release
        uses: "softprops/action-gh-release@v2"
        with:
          token: ${{ github.token }}
          name: "Decker ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: true
          files: |
            readme.md
            changelog.md
            dist/**

  # Regenerate Formula/decker.rb in the decker-edu/homebrew-decker tap so that
  # `brew install decker-edu/decker/decker` picks up this release. Requires a
  # repo secret HOMEBREW_TAP_TOKEN: a PAT with `contents:write` on the tap repo.
  update-homebrew-tap:
    needs: build-all-platforms
    runs-on: ubuntu-latest
    steps:
      - name: Check out tap
        uses: actions/checkout@v4
        with:
          repository: decker-edu/homebrew-decker
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Regenerate formula
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          BASE="https://github.com/decker-edu/decker/releases/download/${TAG}"

          # Download each release asset and compute its sha256.
          sha() {
            local asset="decker-${TAG}-$1"
            curl -fsSL -o "$asset" "${BASE}/${asset}"
            sha256sum "$asset" | cut -d' ' -f1
          }
          MAC_ARM=$(sha "macOS-ARM64")
          LNX_X64=$(sha "Linux-X64")

          mkdir -p tap/Formula
          cat > tap/Formula/decker.rb <<EOF
          class Decker < Formula
            desc "Markdown to reveal.js slide decks, HTML pages, and handouts"
            homepage "https://github.com/decker-edu/decker"
            version "${VERSION}"
            license "GPL-3.0-or-later"

            # External programs Decker shells out to for full functionality
            # (see the "external-tools" section of Decker's default.yaml).
            depends_on "ffmpeg"   # video/audio processing and ffprobe
            depends_on "graphviz" # dot diagrams
            depends_on "gnuplot"  # gnuplot diagrams
            depends_on "plantuml" # plantuml diagrams
            depends_on "d2"       # d2 diagrams
            depends_on "pdf2svg"  # pdf-to-svg conversion
            depends_on "rsync"    # resource deployment

            on_macos do
              on_arm do
                url "${BASE}/decker-${TAG}-macOS-ARM64"
                sha256 "${MAC_ARM}"
              end
            end

            on_linux do
              on_intel do
                url "${BASE}/decker-${TAG}-Linux-X64"
                sha256 "${LNX_X64}"
              end
            end

            def install
              bin.install Dir["*"].first => "decker"
            end

            # These are optional and/or too heavy to force on every user, so
            # they are documented rather than declared as hard dependencies.
            def caveats
              <<~EOS
                Some Decker features need extra tools that are not installed automatically:
                  * PDF export of decks needs Google Chrome:
                      brew install --cask google-chrome
                  * Rendering embedded LaTeX (pdflatex) needs a TeX distribution:
                      brew install --cask basictex
                  * Mermaid diagrams need the mermaid CLI (mmdc):
                      npm install -g @mermaid-js/mermaid-cli
                  * Speech transcription needs whisper.cpp (provides whisper-cli):
                      brew install whisper-cpp
              EOS
            end

            test do
              assert_match "decker version", shell_output("#{bin}/decker version")
            end
          end
          EOF

      - name: Commit and push
        run: |
          set -euo pipefail
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/decker.rb
          git commit -m "decker ${{ github.ref_name }}" || { echo "No changes"; exit 0; }
          git push
